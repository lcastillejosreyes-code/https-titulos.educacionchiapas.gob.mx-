<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de título</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      padding: 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      color: #222;
    }
    .photo-link {
      display: block;
      margin-bottom: 18px;
    }
    img {
      display: block;
      width: 100%;
      max-height: 620px;
      object-fit: contain;
      border-radius: 12px;
      background: #fafafa;
    }
    p {
      color: #555;
      line-height: 1.5;
      margin: 0 0 20px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      background: #0d6efd;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    .small {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Documento relacionado</h1>

    <a class="photo-link" href="https://drive.google.com/file/d/19go4snj2Xp4kv8pEfq6y_3xHMIa2Gpbt/view?usp=drivesdk" target="_blank" rel="noopener">
      <img src="https://drive.google.com/thumbnail?id=19go4snj2Xp4kv8pEfq6y_3xHMIa2Gpbt&sz=w1200" alt="Imagen relacionada con el documento">
    </a>

    <p>Para consultar la información oficial del título, utiliza el siguiente botón.</p>

    <a class="btn" href="https://www.siged.sep.gob.mx/titulos/autenticacion/" target="_blank" rel="noopener">
      Consultar título oficial
    </a>

    <div class="small">
      La imagen se muestra desde Google Drive. Si no carga, tócala para abrirla directamente.
    </div>
  </main>
</body>
</html>
